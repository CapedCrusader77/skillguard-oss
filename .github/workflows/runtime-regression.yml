name: Runtime Verification Regression Tests

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace
      - name: Verify bwrap namespace support
        run: |
          bwrap --unshare-all --proc /proc --dev /dev \
            --ro-bind /usr /usr --ro-bind /etc /etc \
            --symlink usr/bin /bin --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 /usr/bin/true
      - name: Show Python and pip versions
        run: python --version && python -m pip --version
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Install runtime dependencies
        run: python -m pip install typer rich pydantic gitpython
      - name: Install SkillGuard without resolving metadata
        run: python -m pip install --no-deps -e .
      - name: Run full pytest suite
        id: full-tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-results.xml 2>&1 | tee pytest.log
      - name: Require malicious synthetic tool mismatch
        if: always()
        run: python -m pytest -q tests/test_runtime_verification.py -k three_synthetic_tools_in_sandbox
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-regression-pytest-diagnostics
          path: |
            pytest-results.xml
            pytest.log
      - name: Enforce full pytest result
        if: steps.full-tests.outcome == 'failure'
        run: exit 1

  benchmark-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace git
      - name: Install SkillGuard dependencies
        run: python -m pip install typer rich pydantic gitpython
      - name: Install SkillGuard without resolving metadata
        run: python -m pip install --no-deps -e .
      - name: Run bounded real-repository smoke benchmark
        run: skillguard benchmark-runtime benchmark_mcp_smoke.txt --output benchmark_smoke_results.json --runtime-timeout 10
      - name: Upload smoke benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-results
          path: benchmark_smoke_results.json
